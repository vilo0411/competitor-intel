# Probe: can a GitHub-hosted runner reach TikTok via yt-dlp + profile page?
# Results are committed to results/probe.md so they can be read with `git pull` (no TikTok access from local machine).
name: probe-tiktok

on:
  push:
    paths: ['.github/workflows/probe.yml', 'probe/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          pip install -q -U yt-dlp
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg > /dev/null
          echo "yt-dlp $(yt-dlp --version) | $(ffmpeg -version | head -1)"

      - name: Probe TikTok
        run: python3 probe/probe.py probe/handles.txt results/probe.md

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add results
          git commit -m "probe: results $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to commit"
          git push
