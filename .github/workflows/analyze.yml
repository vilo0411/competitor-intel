# One pipeline for everything, so runs never race each other:
#   1. process queued requests/*.json (fetch TikTok, style analysis) — tools are installed only when there is a request
#   2. rebuild every report from cache (picks up labels.json / style.md / insights.md pushed by the agent)
#   3. rebuild docs/index.html, commit docs/, deploy GitHub Pages
name: analyze

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Tên đối thủ (vd: Gorillanomics). Để trống + điền kênh thì lấy handle đầu tiên làm tên'
        required: false
      channels:
        description: 'Kênh TikTok, cách nhau bằng dấu cách (vd: @gorillanomics @kenh2). Để trống = dùng kênh đã lưu'
        required: false
      refresh:
        description: 'Lấy lại view mới (bỏ cache)'
        type: boolean
        default: false
      style:
        description: 'Số video top phân tích phong cách dựng (0 = bỏ qua)'
        default: '5'
      limit:
        description: 'Số video tối đa mỗi kênh'
        default: '300'
  push:
    branches: [main]
    paths:
      - 'requests/**'
      - 'docs/**/insights.md'
      - 'docs/**/style.md'
      - 'docs/**/labels.json'
      - 'scripts/**'
      - '.github/workflows/analyze.yml'
  schedule:
    - cron: '0 1 * * 1' # Monday 08:00 Asia/Ho_Chi_Minh: refresh every saved competitor

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: competitor-intel
  cancel-in-progress: false

env:
  WHISPER_VERSION: v1.7.6
  WHISPER_MODEL_FILE: ggml-large-v3-turbo-q5_0.bin

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Queue request from button / schedule
        env:
          IN_NAME: ${{ inputs.name }}
          IN_CHANNELS: ${{ inputs.channels }}
          IN_REFRESH: ${{ inputs.refresh }}
          IN_STYLE: ${{ inputs.style }}
          IN_LIMIT: ${{ inputs.limit }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$IN_NAME$IN_CHANNELS" ]; then
            node -e 'const e=process.env; console.log(JSON.stringify({name:e.IN_NAME||"", channels:(e.IN_CHANNELS||"").split(/\s+/).filter(Boolean), refresh:e.IN_REFRESH==="true", style:Number(e.IN_STYLE||5), limit:Number(e.IN_LIMIT||300)}))' > /tmp/req.json
            node scripts/process-requests.mjs enqueue "$(cat /tmp/req.json)"
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then node scripts/process-requests.mjs refresh-all; fi

      - name: Check queue
        id: q
        run: |
          n=$(ls requests/*.json 2>/dev/null | wc -l)
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "Queued requests: $n"

      - name: Install yt-dlp + ffmpeg
        if: steps.q.outputs.count != '0'
        run: |
          pip install -q -U yt-dlp
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg > /dev/null
          yt-dlp --version

      - name: Cache whisper.cpp + model
        if: steps.q.outputs.count != '0'
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: ~/whisper
          key: whisper-${{ env.WHISPER_VERSION }}-${{ env.WHISPER_MODEL_FILE }}-portable

      - name: Build whisper.cpp + download model
        if: steps.q.outputs.count != '0' && steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          git clone -q --depth 1 --branch "$WHISPER_VERSION" https://github.com/ggml-org/whisper.cpp /tmp/whisper.cpp
          # Portable build (no -march=native) so the cached binary runs on any runner CPU
          cmake -S /tmp/whisper.cpp -B /tmp/whisper.cpp/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DWHISPER_BUILD_TESTS=OFF > /dev/null
          cmake --build /tmp/whisper.cpp/build -j"$(nproc)" --config Release --target whisper-cli > /dev/null
          mkdir -p ~/whisper/bin
          cp /tmp/whisper.cpp/build/bin/whisper-cli ~/whisper/bin/
          curl -sSL -o ~/whisper/"$WHISPER_MODEL_FILE" "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/$WHISPER_MODEL_FILE"
          ls -la ~/whisper ~/whisper/bin

      - name: Process queued requests
        if: steps.q.outputs.count != '0'
        run: |
          export PATH="$HOME/whisper/bin:$PATH" WHISPER_MODEL="$HOME/whisper/$WHISPER_MODEL_FILE" WHISPER_THREADS="$(nproc)"
          node scripts/process-requests.mjs queue

      - name: Rebuild all reports from cache
        run: node scripts/process-requests.mjs offline

      - name: Build index
        run: node scripts/build-index.mjs

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A # only docs/ and requests/ change on the runner; avoids pathspec errors when requests/ is absent
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -q -m "ci: update reports (${{ github.event_name }})"
          for i in 1 2 3 4 5; do
            git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "push failed" && exit 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
